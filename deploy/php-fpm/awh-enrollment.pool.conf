; Template only. Install as a reviewed PHP-FPM pool configuration on Ubuntu.
; Replace the nonce-hash placeholder out-of-band; never commit the nonce itself.
[awh-hub]
user = awh-hub
group = awh-hub
listen = /run/php/php8.3-fpm-awh.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 200
clear_env = yes
env[AWH_HUB_DB_PATH] = /var/lib/awh-hub/awh.sqlite
env[AWH_ENROLLMENT_BOOTSTRAP_NONCE_HASH] = REPLACE_WITH_SHA256_HASH_PROVISIONED_OUT_OF_BAND
