# AWH global edge hardening. Install under /etc/nginx/conf.d/ (http context).
server_tokens off;

gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml;

# Auth is intentionally conservative; valid signed-in traffic does not use this zone.
limit_req_zone $binary_remote_addr zone=awh_auth:10m rate=12r/m;
limit_req_status 429;

# Release-pinned JS/CSS are immutable. HTML/JSON revalidate; protected API is never cached.
map $uri $awh_cache_control {
    default "no-cache";
    ~^/api/ "no-store";
    ~*\.(?:js|css|woff2?)$ "public, max-age=31536000, immutable";
}
