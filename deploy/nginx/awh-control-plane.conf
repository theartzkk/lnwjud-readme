# Include only inside the reviewed AWH HTTPS server block.
# This route is not part of the read-only gateway and must never be added to
# the HTTP redirect server or a wildcard/default server.
location ^~ /api/v1/control/ {
    auth_basic off;
    client_max_body_size 16k;
    access_log off;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /opt/awh-hub/control-plane-current/hub/public/control-plane.php;
    fastcgi_param AWH_HUB_DB_PATH /var/lib/awh-hub/awh.sqlite;
    fastcgi_param AWH_CONTROL_ORIGIN https://PREVIEW_HOSTNAME;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_param HTTP_ORIGIN $http_origin;
    fastcgi_param HTTP_COOKIE $http_cookie;
    fastcgi_param HTTP_X_AWH_CSRF $http_x_awh_csrf;
    fastcgi_param QUERY_STRING $query_string;
    fastcgi_pass unix:/run/php/php8.3-fpm-awh.sock;
}

# The owner-auth cutover removes the old server-level Basic Auth directives
# from the authoritative site. Public auth/control locations stay explicit;
# technical locations are protected by the cutover transformation.
location ^~ /api/v1/auth/ {
    auth_basic off;
    client_max_body_size 16k;
    access_log off;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /opt/awh-hub/control-plane-current/hub/public/control-plane.php;
    fastcgi_param AWH_HUB_DB_PATH /var/lib/awh-hub/awh.sqlite;
    fastcgi_param AWH_CONTROL_ORIGIN https://PREVIEW_HOSTNAME;
    fastcgi_param HTTP_ORIGIN $http_origin;
    fastcgi_param HTTP_COOKIE $http_cookie;
    fastcgi_param HTTP_X_AWH_CSRF $http_x_awh_csrf;
    fastcgi_param REMOTE_ADDR $remote_addr;
    fastcgi_param HTTP_USER_AGENT $http_user_agent;
    fastcgi_param QUERY_STRING $query_string;
    fastcgi_pass unix:/run/php/php8.3-fpm-awh.sock;
}
