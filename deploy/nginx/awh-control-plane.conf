# Include only inside the reviewed AWH HTTPS server block.
# This route is not part of the read-only gateway and must never be added to
# the HTTP redirect server or a wildcard/default server.
location ^~ /api/v1/control/ {
    auth_basic off;
    # Conversation attachments are accepted only by the bounded M9 upload
    # route.  Keep the Nginx ceiling aligned with the application-wide 60 MiB
    # aggregate policy rather than allowing an unbounded PHP upload.
    client_max_body_size 64m;
    access_log off;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /opt/awh-hub/control-plane-current/hub/public/control-plane.php;
    fastcgi_param AWH_HUB_DB_PATH /var/lib/awh-hub/awh.sqlite;
    fastcgi_param AWH_CONTROL_ORIGIN https://PREVIEW_HOSTNAME;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_param HTTP_ORIGIN $http_origin;
    fastcgi_param HTTP_COOKIE $http_cookie;
    fastcgi_param HTTP_X_AWH_CSRF $http_x_awh_csrf;
    fastcgi_param QUERY_STRING $query_string;
    # Rendered from the existing enrollment PHP-FPM authority at deploy time.
    # Never infer a generic www pool for Hub/control traffic.
    fastcgi_pass unix:PREVIEW_AWH_FPM_SOCKET;
}

# Owner-only Database Studio. The PHP router enforces the existing AWH Owner
# session, same-origin policy, CSRF on POST, step-up for SQL, and read-only SQL.
location = /database-studio.php {
    auth_basic off;
    client_max_body_size 32k;
    access_log off;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /opt/awh-hub/control-plane-current/hub/public/database-studio.php;
    fastcgi_param AWH_HUB_DB_PATH /var/lib/awh-hub/awh.sqlite;
    fastcgi_param AWH_HUB_BACKUP_ROOT /var/backups/awh-hub;
    fastcgi_param AWH_CONTROL_ORIGIN https://PREVIEW_HOSTNAME;
    fastcgi_param HTTP_ORIGIN $http_origin;
    fastcgi_param HTTP_COOKIE $http_cookie;
    fastcgi_param HTTP_X_AWH_CSRF $http_x_awh_csrf;
    fastcgi_param QUERY_STRING $query_string;
    fastcgi_pass unix:PREVIEW_AWH_FPM_SOCKET;
}
