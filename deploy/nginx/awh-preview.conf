# Template only. Replace placeholders during a reviewed VPS deployment.
# Final application-auth shape: the public shell serves the username/password
# login; Basic Auth remains only on the bounded technical preview surface until
# the reviewed production cutover installs this contract.
server {
    listen 443 ssl http2;
    server_name PREVIEW_HOSTNAME;

    root /var/www/awh-web/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/PREVIEW_HOSTNAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/PREVIEW_HOSTNAME/privkey.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" always;

    location ^~ /api/v1/ {
        auth_basic "AWH Remote Preview";
        auth_basic_user_file /etc/nginx/.awh-preview-users;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/awh-hub/public/web-gateway.php;
        fastcgi_param AWH_HUB_DB_PATH /var/lib/awh-hub/awh.sqlite;
        fastcgi_param AWH_WEB_GATEWAY_TRUSTED_PERIMETER nginx;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location / {
        auth_basic off;
        try_files $uri $uri/ =404;
    }

    location ^~ /preview/ {
        auth_basic "AWH Remote Preview";
        auth_basic_user_file /etc/nginx/.awh-preview-users;
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    server_name PREVIEW_HOSTNAME;
    return 301 https://$host$request_uri;
}
