# Template only. Include this location inside the existing HTTPS AWH server.
# It inherits the existing Nginx perimeter; it is not a browser enrollment UI.
# The target is an atomic enrollment-only release symlink, separate from M3D read.

location ^~ /api/v1/enrollment/ {
    # The existing server-wide Basic Auth remains on preview assets and M3D
    # read routes. This isolated API location must pass Bearer auth instead.
    auth_basic off;
    client_max_body_size 16k;
    access_log off;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /opt/awh-hub/enrollment-current/hub/public/enrollment.php;
    fastcgi_param AWH_HUB_DB_PATH /var/lib/awh-hub/awh.sqlite;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_param HTTP_ORIGIN $http_origin;
    fastcgi_param HTTP_X_AWH_BOOTSTRAP_NONCE $http_x_awh_bootstrap_nonce;
    fastcgi_param QUERY_STRING $query_string;
    fastcgi_pass unix:/run/php/php8.3-fpm-awh.sock;
}
