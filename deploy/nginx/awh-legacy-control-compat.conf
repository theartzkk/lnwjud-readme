server {
    listen 443 ssl http2;
    server_name 157-85-108-142.sslip.io;

    ssl_certificate /etc/letsencrypt/live/157-85-108-142.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/157-85-108-142.sslip.io/privkey.pem;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Temporary compatibility for already-installed Desktop agents. Bearer auth
    # stays on the same origin, so POST and Authorization are preserved.
    location ^~ /api/v1/control/ {
        auth_basic off;
        client_max_body_size 64m;
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/awh-hub/control-plane-current/hub/public/control-plane.php;
        fastcgi_param AWH_HUB_DB_PATH /var/lib/awh-hub/awh.sqlite;
        fastcgi_param AWH_CONTROL_ORIGIN https://kruart.online;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTP_ORIGIN $http_origin;
        fastcgi_param HTTP_COOKIE $http_cookie;
        fastcgi_param HTTP_X_AWH_CSRF $http_x_awh_csrf;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_pass unix:/run/php/php8.3-fpm-awh.sock;
    }

    location / {
        return 308 https://kruart.online$request_uri;
    }
}
