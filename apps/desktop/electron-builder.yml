appId: th.theartzkk.awh
productName: Art’s Workspace Hub
asar: true
npmRebuild: false
directories:
  output: dist/installers
  buildResources: build
files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/renderer/**/*
  - build/icon.ico
  - build/icon.png
  - package.json
publish:
  provider: github
  owner: theartzkk
  repo: lnwjud-readme
  releaseType: release
extraResources:
  - from: ../../packages/capabilities/src/windows-capability-bridge.ps1
    to: windows-capability-bridge.ps1
  - from: build/windows-capability-bridge.sha256
    to: windows-capability-bridge.sha256
  - from: build/lnwjud-mcp-stdio.cjs
    to: lnwjud-mcp-stdio.cjs
  - from: build/lnwjud-mcp-stdio.cmd
    to: lnwjud-mcp-stdio.cmd
  - from: build/lnwjud-node.exe
    to: lnwjud-node.exe
  - from: ../../native/windows-ocr/bin
    to: windows-ocr
# Tunnel profile expects these next to lnwjud.exe (not only under resources/).
extraFiles:
  - from: build/lnwjud-mcp-stdio.cjs
    to: lnwjud-mcp-stdio.cjs
  - from: build/lnwjud-mcp-stdio.cmd
    to: lnwjud-mcp-stdio.cmd
  - from: build/lnwjud-node.exe
    to: lnwjud-node.exe
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: AWH-Setup-${version}.${ext}
  # Keep the branded icon embedded in lnwjud.exe for Windows shortcuts and taskbar.
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  # Create the Start Menu link in installer.nsh from $INSTDIR so no build-user path can be baked in.
  createStartMenuShortcut: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  uninstallDisplayName: ${productName}
  include: build/installer.nsh
