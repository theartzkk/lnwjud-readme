name: M12 QA Contract Sync

on:
  push:
    branches: ['awh/qa-m12-contract-sync']

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: awh/qa-m12-contract-sync
          fetch-depth: 0
      - name: Synchronize the legacy fixture with the conversation-bound contract
        shell: python
        run: |
          from pathlib import Path
          path = Path('hub/tests/m12-central-project-authority.php')
          text = path.read_text(encoding='utf-8')
          old = "$historyAgent->respond($owner, $project, null, null, 'คำถามล่าสุด'"
          new = "$historyAgent->respond($owner, $project, $conversation, $message, 'คำถามล่าสุด'"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale fixture call, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run complete Hub regression suite
        run: npm run hub:test
      - name: Remove one-shot workflow and commit verified fixture sync
        run: |
          rm .github/workflows/qa-m12-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hub/tests/m12-central-project-authority.php .github/workflows/qa-m12-one-shot.yml
          git diff --cached --check
          git commit -m 'test: sync M12 native conversation fixture'
          git push origin HEAD:awh/qa-m12-contract-sync
