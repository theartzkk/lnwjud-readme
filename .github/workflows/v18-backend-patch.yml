name: V18 Backend Patch

on:
  push:
    branches: [awh/product-v1.8-automation-surface]
    paths:
      - .github/workflows/v18-backend-patch.yml
      - scripts/ops/v18-backend-patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: awh/product-v1.8-automation-surface
          fetch-depth: 0
      - name: Apply bounded backend patch
        run: python3 scripts/ops/v18-backend-patch.py
      - name: Verify PHP syntax
        run: |
          php -l hub/src/HubControlPlaneService.php
          php -l hub/src/HubControlPlaneRouter.php
          php -l hub/src/HubAutomationSchedulerService.php
          php -l hub/bin/awh-native-executor.php
          git diff --check
      - name: Commit patch if needed
        run: |
          if git diff --quiet -- hub/src/HubControlPlaneService.php hub/src/HubControlPlaneRouter.php; then
            echo "Backend already patched"
            exit 0
          fi
          git config user.name "AWH Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add hub/src/HubControlPlaneService.php hub/src/HubControlPlaneRouter.php
          git commit -m "feat: expose canonical automation control surface"
          git push origin HEAD:awh/product-v1.8-automation-surface
