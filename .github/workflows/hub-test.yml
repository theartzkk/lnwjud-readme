name: Hub QA

on:
  push:
    branches: ['awh/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hub-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hub-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify PHP runtime
        run: php -v
      - name: Run AWH Hub regression suite
        run: npm run hub:test
