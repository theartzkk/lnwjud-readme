name: AWH Integration Gateway

on:
  push:
    branches: [main, 'awh/**']
    paths:
      - 'src/integration/**'
      - 'test/integration-foundation.test.ts'
      - 'test/hub-read-client.test.ts'
      - 'config/awh-integration-contract.json'
      - 'docs/architecture/AWH-INTEGRATION-M1.md'
      - 'docs/architecture/AWH-WORLD-CLASS-NORTH-STAR.md'
      - '.github/workflows/integration-gateway.yml'
  pull_request:
    paths:
      - 'src/integration/**'
      - 'test/integration-foundation.test.ts'
      - 'test/hub-read-client.test.ts'
      - 'config/awh-integration-contract.json'
      - 'docs/architecture/AWH-INTEGRATION-M1.md'
      - 'docs/architecture/AWH-WORLD-CLASS-NORTH-STAR.md'
      - '.github/workflows/integration-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-gateway-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  integration-safety:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck integration contracts
        run: npm run typecheck
      - name: Verify integration boundary and bounded Hub reads
        run: node --test --test-concurrency=1 --import tsx --test test/integration-foundation.test.ts test/hub-read-client.test.ts
      - name: Build exact candidate
        run: npm run build
