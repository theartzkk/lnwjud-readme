name: M18 System Health One Shot

on:
  push:
    branches: [awh/sustainability-foundation]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: awh/sustainability-foundation
          fetch-depth: 0
      - name: Patch verified backup health into Database Studio
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service = Path('hub/src/HubDatabaseStudioService.php')
          text = service.read_text()
          marker = "declare(strict_types=1);\n\n"
          require = "require_once __DIR__ . '/HubBackupService.php';\n\n"
          if require not in text:
              if marker not in text:
                  raise SystemExit('service header marker missing')
              text = text.replace(marker, marker + require, 1)
          old = """    private function backupMetadata(): array
    {
        $root = getenv('AWH_HUB_BACKUP_ROOT'); if (!is_string($root) || $root === '' || !is_dir($root) || is_link($root)) return ['configured' => false, 'latest' => null]; $candidates = glob(rtrim($root, DIRECTORY_SEPARATOR) . DIRECTORY_SEPARATOR . '*'); if (!is_array($candidates)) return ['configured' => true, 'latest' => null]; $latestPath = null; $latestAt = 0;
        foreach ($candidates as $path) { if (!is_file($path) || is_link($path)) continue; $time = (int) (@filemtime($path) ?: 0); if ($time > $latestAt) { $latestAt = $time; $latestPath = $path; } } if ($latestPath === null) return ['configured' => true, 'latest' => null]; return ['configured' => true, 'latest' => ['name' => basename($latestPath), 'sizeBytes' => (int) (@filesize($latestPath) ?: 0), 'modifiedAt' => gmdate('c', $latestAt)]];
    }
"""
          new = """    private function backupMetadata(): array
    {
        $root = getenv('AWH_HUB_BACKUP_ROOT');
        if (!is_string($root) || trim($root) === '') return ['configured' => false, 'latest' => null];
        return HubBackupService::latestMetadata($root);
    }
"""
          if old not in text:
              raise SystemExit('backupMetadata contract drifted')
          service.write_text(text.replace(old, new, 1))

          app = Path('web/database.js')
          js = app.read_text()
          old_cards = """  const cards = [
    ['ขนาดฐานข้อมูล', bytes(data.database?.sizeBytes)],
    ['ตาราง', number(data.summary?.tables)],
    ['รายการที่เปิดดูได้', number(data.summary?.visibleRows)],
    ['Schema version', `v${number(data.database?.schemaVersion)}`],
    ['Journal', String(data.database?.journalMode || '—').toUpperCase()],
  ];
"""
          new_cards = """  const backupStatus = data.backup?.latest?.status === 'VERIFIED' ? 'พร้อมกู้คืน' : data.backup?.latest?.status === 'REVIEW' ? 'ต้องตรวจสอบ' : data.backup?.configured ? 'ยังไม่มี Backup' : 'ยังไม่ตั้งค่า';
  const cards = [
    ['ขนาดฐานข้อมูล', bytes(data.database?.sizeBytes)],
    ['ตาราง', number(data.summary?.tables)],
    ['รายการที่เปิดดูได้', number(data.summary?.visibleRows)],
    ['Schema version', `v${number(data.database?.schemaVersion)}`],
    ['Journal', String(data.database?.journalMode || '—').toUpperCase()],
    ['Backup ล่าสุด', backupStatus],
  ];
"""
          if old_cards not in js:
              raise SystemExit('database overview contract drifted')
          app.write_text(js.replace(old_cards, new_cards, 1))

          test = Path('test/database-studio-web.test.ts')
          ts = test.read_text()
          needle = "    assert.match(app, /DATABASE_TABLE_RESTRICTED|STEP_UP_REQUIRED/);\n"
          addition = needle + "    assert.match(app, /Backup ล่าสุด/);\n"
          if 'assert.match(app, /Backup ล่าสุด/);' not in ts:
              if needle not in ts:
                  raise SystemExit('database web fixture marker missing')
              test.write_text(ts.replace(needle, addition, 1))
          PY
      - name: Validate patched PHP
        run: |
          php -l hub/src/HubBackupService.php
          php -l hub/src/HubDatabaseStudioService.php
          php hub/tests/sustainability-foundation.php
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m18-system-health.yml
          git add hub/src/HubDatabaseStudioService.php web/database.js test/database-studio-web.test.ts
          git commit -m "feat: surface verified backup health"
          git push origin HEAD:awh/sustainability-foundation
