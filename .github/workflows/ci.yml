name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  desktop-package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run desktop:package
      - name: Verify packaged executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path out -Recurse -Filter ArtAgent.exe | Select-Object -First 1
          if (-not $exe) { throw 'ArtAgent.exe not found in packaged output' }
          Write-Host "Packaged executable: $($exe.FullName)"
      - name: Smoke test packaged Control Center
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path out -Recurse -Filter ArtAgent.exe | Select-Object -First 1
          if (-not $exe) { throw 'ArtAgent.exe not found for smoke test' }
          $env:ART_AGENT_DATA_DIR = Join-Path $env:RUNNER_TEMP 'art-agent-smoke-data'
          $env:ART_AGENT_SMOKE_TEST = '1'
          Remove-Item -Recurse -Force $env:ART_AGENT_DATA_DIR -ErrorAction SilentlyContinue
          $marker = Join-Path $env:ART_AGENT_DATA_DIR 'desktop-smoke.json'
          $process = Start-Process -FilePath $exe.FullName -ArgumentList '--smoke-test' -PassThru

          $smoke = $null
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Milliseconds 500
            if (Test-Path $marker) {
              try {
                $candidate = Get-Content $marker -Raw | ConvertFrom-Json
                if ($candidate.stage -eq 'passed' -or $candidate.stage -eq 'failed') {
                  $smoke = $candidate
                  break
                }
              } catch {
                # Marker may be between write/replace operations; retry.
              }
            }
          }

          if (-not $process.HasExited) {
            & taskkill.exe /PID $process.Id /T /F | Out-Host
          }

          if (-not $smoke) {
            $lastMarker = if (Test-Path $marker) { Get-Content $marker -Raw } else { '<missing>' }
            throw "Packaged Control Center did not produce a final smoke marker. Last marker: $lastMarker"
          }
          if ($smoke.ok -ne $true) {
            throw "Packaged Control Center smoke failed: $($smoke | ConvertTo-Json -Compress)"
          }
          if ($smoke.apiReady -ne $true -or $smoke.requiredDom -ne $true -or $smoke.overviewName -ne 'Art Agent' -or $smoke.overviewVersion -ne '0.3.0') {
            throw "Desktop smoke marker is incomplete: $($smoke | ConvertTo-Json -Compress)"
          }
          Write-Host "Packaged Control Center smoke passed: $($smoke | ConvertTo-Json -Compress)"
