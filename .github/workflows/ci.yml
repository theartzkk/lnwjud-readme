name: CI

on:
  push:
    branches: [main, 'agent/**', 'awh/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Push and pull_request events for the same feature branch share one lane.
# Opening/updating a PR therefore cancels the redundant feature-push run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: runner.os != 'Windows'
        name: Verify CI cost and release-gate policy
        run: node scripts/qa/verify-ci-policy.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - if: runner.os != 'Windows'
        name: Verify Cloud artifact import with ZipArchive
        run: |
          if ! php -r 'exit(class_exists("ZipArchive") ? 0 : 1);'; then
            sudo apt-get update -qq
            sudo apt-get install -y php-zip
          fi
          php -r 'exit(class_exists("ZipArchive") ? 0 : 1);'
          php hub/tests/m18-cloud-first-control.php
      - run: npm run typecheck
      - if: runner.os == 'Windows'
        run: npm run test:windows
      - if: runner.os != 'Windows'
        run: npm test
      - if: runner.os != 'Windows'
        name: Verify final mobile shell and typed deploy contracts
        run: node --import tsx --test test/final-uat-shell.test.ts
      - if: runner.os != 'Windows'
        run: npm run hub:test
      - run: npm run build

  desktop-runtime-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Electron runtime binary explicitly
        run: |
          node node_modules/electron/install.js
          test -x node_modules/electron/dist/electron
          test -f node_modules/electron/dist/chrome-sandbox
      - name: Configure Chromium SUID sandbox
        run: |
          sandbox='node_modules/electron/dist/chrome-sandbox'
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          stat -c '%U %G %a %n' "$sandbox"
          test "$(stat -c '%U' "$sandbox")" = 'root'
          test "$(stat -c '%G' "$sandbox")" = 'root'
          test "$(stat -c '%a' "$sandbox")" = '4755'
      - name: Ensure virtual display
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
      - name: Smoke test Electron renderer, preload and IPC under Xvfb
        env:
          ART_AGENT_DATA_DIR: ${{ runner.temp }}/art-agent-smoke-data
          ART_AGENT_SMOKE_TEST: '1'
        run: |
          rm -rf "$ART_AGENT_DATA_DIR"
          mkdir -p "$ART_AGENT_DATA_DIR"
          set +e
          timeout --signal=TERM --kill-after=5s 30s xvfb-run -a npm run desktop:smoke
          runtime_code=$?
          set -e
          echo "Electron smoke wrapper exit code: $runtime_code"
          marker="$ART_AGENT_DATA_DIR/desktop-smoke.json"
          if [ -f "$marker" ]; then cat "$marker"; else echo '<missing>'; fi
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const marker = path.join(process.env.ART_AGENT_DATA_DIR, 'desktop-smoke.json');
          if (!fs.existsSync(marker)) throw new Error('Electron runtime did not create a smoke marker');
          const smoke = JSON.parse(fs.readFileSync(marker, 'utf8'));
          if (!smoke.ok || smoke.stage !== 'passed' || !smoke.apiReady || !smoke.requiredDom || smoke.overviewName !== 'Art’s Workspace Hub' || smoke.overviewVersion !== pkg.version) {
            throw new Error(`Electron runtime smoke marker invalid: ${JSON.stringify(smoke)}`);
          }
          console.log(`Electron runtime smoke passed: ${JSON.stringify(smoke)}`);
          NODE

  # Desktop packaging is intentionally a release gate, not a per-commit feature gate.
  # It still runs for every PR, canonical branch merge, main, and manual release check.
  desktop-installer-windows:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/awh/api-independence' || github.ref == 'refs/heads/main' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare audited installer toolchain explicitly
        shell: pwsh
        run: |
          node node_modules/electron/install.js
          Push-Location node_modules/electron-winstaller
          try {
            node script/select-7z-arch.js
          } finally {
            Pop-Location
          }
          $electron = 'node_modules/electron/dist/electron.exe'
          $sevenZip = 'node_modules/electron-winstaller/vendor/7z.exe'
          $sevenZipDll = 'node_modules/electron-winstaller/vendor/7z.dll'
          if (-not (Test-Path $electron)) { throw "Electron runtime missing: $electron" }
          if (-not (Test-Path $sevenZip)) { throw "Squirrel 7-Zip helper missing: $sevenZip" }
          if (-not (Test-Path $sevenZipDll)) { throw "Squirrel 7-Zip DLL missing: $sevenZipDll" }
          Write-Host "Electron runtime: $electron"
          Write-Host "Squirrel 7-Zip helper: $sevenZip"
      - run: npm run typecheck
      - run: npm run test:windows
      - run: npm run desktop:make
      - name: Verify packaged Windows runtime
        run: npm run desktop:verify:windows
      - name: Create portable Windows archive
        shell: pwsh
        run: |
          Remove-Item AWH-Windows-x64.zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path out/AWH-win32-x64 -DestinationPath AWH-Windows-x64.zip -CompressionLevel Optimal
          if (-not (Test-Path AWH-Windows-x64.zip)) { throw 'Portable Windows archive missing' }
          Get-FileHash AWH-Windows-x64.zip -Algorithm SHA256 | Format-List
      - name: Resolve release metadata
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "AWH release version: $version"
      - name: Verify packaged app and Squirrel installer set
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $exe = Get-ChildItem -Path out -Recurse -Filter AWH.exe | Select-Object -First 1
          $setup = Get-ChildItem -Path out/make -Recurse -Filter AWHSetup.exe | Select-Object -First 1
          $releases = Get-ChildItem -Path out/make -Recurse -Filter RELEASES | Select-Object -First 1
          $nupkg = Get-ChildItem -Path out/make -Recurse -Filter *.nupkg | Select-Object -First 1
          if (-not $exe) { throw 'AWH.exe not found in packaged output' }
          if (-not $setup) { throw 'AWHSetup.exe not found in maker output' }
          if (-not $releases) { throw 'Squirrel RELEASES file not found' }
          if (-not $nupkg) { throw 'Squirrel .nupkg not found' }
          if ($setup.Length -lt 1MB) { throw "ArtAgentSetup.exe is unexpectedly small: $($setup.Length) bytes" }
          if ($nupkg.Length -lt 1MB) { throw "Squirrel package is unexpectedly small: $($nupkg.Length) bytes" }
          Write-Host "Packaged exe: $($exe.FullName)"
          Write-Host "Installer: $($setup.FullName)"
          Write-Host "Package: $($nupkg.FullName)"
          $hashes = @($setup, $nupkg) | Get-FileHash -Algorithm SHA256
          $hashFile = Join-Path (Split-Path $setup.DirectoryName -Parent) 'AWH-SHA256.txt'
          $hashes | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } | Set-Content -Encoding ascii $hashFile
          Get-Content $hashFile | Write-Host
      - name: Verify packaged Windows main module boots
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path out -Recurse -Filter AWH.exe | Select-Object -First 1
          if (-not $exe) { throw 'AWH.exe not found for boot verification' }
          $env:ART_AGENT_DATA_DIR = Join-Path $env:RUNNER_TEMP 'art-agent-package-boot'
          $env:ART_AGENT_SMOKE_TEST = '1'
          $env:ELECTRON_ENABLE_LOGGING = '1'
          Remove-Item -Recurse -Force $env:ART_AGENT_DATA_DIR -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $env:ART_AGENT_DATA_DIR -Force | Out-Null
          $marker = Join-Path $env:ART_AGENT_DATA_DIR 'desktop-smoke.json'
          $stdout = Join-Path $env:ART_AGENT_DATA_DIR 'desktop-boot.stdout.log'
          $stderr = Join-Path $env:ART_AGENT_DATA_DIR 'desktop-boot.stderr.log'
          $process = Start-Process -FilePath $exe.FullName -ArgumentList '--smoke-test' -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $boot = $null
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Milliseconds 500
            if (Test-Path $marker) {
              try {
                $boot = Get-Content $marker -Raw | ConvertFrom-Json
                if ($boot.stage) { break }
              } catch {}
            }
          }
          if (-not $process.HasExited) { & taskkill.exe /PID $process.Id /T /F | Out-Host }
          if (Test-Path $stdout) { Get-Content $stdout -Raw | Write-Host }
          if (Test-Path $stderr) { Get-Content $stderr -Raw | Write-Host }
          if (Test-Path $marker) { Get-Content $marker -Raw | Write-Host }
          if (-not $boot -or -not $boot.stage) { throw 'Packaged ArtAgent.exe did not execute the desktop main module' }
          if ($boot.argv -notcontains '--smoke-test') { throw 'Packaged main module did not receive --smoke-test' }
      - name: Verify packaged Windows MCP stdio protocol
        shell: pwsh
        run: ./.github/scripts/verify-packaged-mcp.ps1 -Version '${{ steps.version.outputs.version }}'
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: AWH-Windows-Installer-${{ steps.version.outputs.version }}
          path: |
            out/make/squirrel.windows/x64/**
            out/make/**/AWH-SHA256.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: AWH-Windows-x64
          path: AWH-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  desktop-package-macos:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/awh/api-independence' || github.ref == 'refs/heads/main' }}
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Electron runtime binary explicitly
        run: node node_modules/electron/install.js
      - run: npm run typecheck
      - run: npm run test:desktop-native
      - name: Package macOS x64
        run: npm run desktop:package:mac:x64
      - name: Verify packaged macOS runtime
        run: npm run desktop:verify:mac
      - name: Create portable macOS archive
        run: |
          ditto -c -k --sequesterRsrc --keepParent out/AWH-darwin-x64/AWH.app AWH-macOS-x64.zip
          test -s AWH-macOS-x64.zip
          shasum -a 256 AWH-macOS-x64.zip
      - name: Upload macOS portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: AWH-macOS-x64
          path: AWH-macOS-x64.zip
          if-no-files-found: error
          retention-days: 14
