name: M17 One Shot Fix

on:
  push:
    branches: ['awh/m17-database-studio']

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: awh/m17-database-studio
          fetch-depth: 0
      - name: Apply exact M17 hardening fixes
        shell: python
        run: |
          from pathlib import Path

          service = Path('hub/src/HubDatabaseStudioService.php')
          text = service.read_text(encoding='utf-8')
          old = "pragma_|sqlite_dbpage"
          new = "pragma_[a-z0-9_]*|sqlite_dbpage"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one pragma guard, found {text.count(old)}')
          service.write_text(text.replace(old, new, 1), encoding='utf-8')

          html = Path('web/database.html')
          text = html.read_text(encoding='utf-8')
          old = 'มีข้อมูลยืนยันตัวตน credential หรือ bearer material จึงไม่อนุญาตให้ Browse/Export จาก Database Studio'
          new = 'มีข้อมูลยืนยันตัวตนหรือข้อมูลลับของระบบ จึงไม่อนุญาตให้เปิดดูหรือส่งออกจาก Database Studio'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one protected-table message, found {text.count(old)}')
          html.write_text(text.replace(old, new, 1), encoding='utf-8')

          fixture = Path('hub/tests/m17-database-studio.php')
          text = fixture.read_text(encoding='utf-8')
          marker = "    $server = ['HTTP_COOKIE'=>'__Host-awh_control_session=' . $ownerToken"
          if text.count(marker) != 1:
              raise SystemExit(f'expected exactly one router fixture marker, found {text.count(marker)}')
          refresh = "    $routerAt = gmdate('c'); $routerExpires = gmdate('c', time() + 3600); $pdo->prepare('UPDATE control_sessions SET last_seen_at=:at, expires_at=:expires, step_up_at=:at WHERE session_hash=:hash')->execute(['at'=>$routerAt,'expires'=>$routerExpires,'hash'=>hash('sha256',$ownerToken)]);\n"
          fixture.write_text(text.replace(marker, refresh + marker, 1), encoding='utf-8')
      - name: Run strict M17 backend regression
        run: php hub/tests/m17-database-studio.php
      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run M17 web regression
        run: node --import tsx --test test/database-studio-web.test.ts
      - name: Remove one-shot workflow and commit verified fixes
        run: |
          rm .github/workflows/m17-one-shot-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hub/src/HubDatabaseStudioService.php hub/tests/m17-database-studio.php web/database.html .github/workflows/m17-one-shot-fix.yml
          git diff --cached --check
          git commit -m 'fix: harden database studio read boundary'
          git push origin HEAD:awh/m17-database-studio
