name: AWH Canonical Source Authority

on:
  pull_request:
    branches:
      - awh/api-independence
    paths:
      - 'scripts/ops/canonical-source-preflight.mjs'
      - 'scripts/ops/guarded-control-plane-deploy.mjs'
      - 'scripts/ops/activate-owner-auth.mjs'
      - 'test/canonical-source-preflight.test.mjs'
      - 'package.json'
      - '.github/workflows/awh-canonical-source.yml'
      - 'deploy/awh-control-plane/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run canonical source regression
        run: node --test test/canonical-source-preflight.test.mjs
